services:
  docker-mcp:
    build: .
    container_name: docker-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - WEBUI_TITLE=Docker MCP Control Center
      - WEBUI_PASSWORD=${WEBUI_PASSWORD:-change-me}
      - WEBUI_SESSION_SECRET=${WEBUI_SESSION_SECRET:-replace-this-session-secret}
      - DOCKER_ENABLE_MUTATIONS=true
      - DOCKER_ENABLE_CONTAINER_CREATE=true
      - DOCKER_ENABLE_CONTAINER_EXEC=true
      - DOCKER_ENABLE_SHELL_EXEC=true
      - DOCKER_ALLOWED_IMAGES=*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
